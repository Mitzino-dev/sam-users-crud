networks:
  sam-users-net:
    driver: bridge
    name: sam-users-net

services:
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password}
      POSTGRES_DB: ${DB_NAME:-users_db}
    ports:
      # Puerto en el host (configurable por si 5432 ya esta ocupado).
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - sam-users-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-users_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Opcional: pgAdmin para inspeccionar la BD desde el navegador
  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   container_name: pgadmin
  #   profiles: ["tools"]
