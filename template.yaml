AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Users CRUD API - Node 20 + TypeScript + SAM (arquitectura hexagonal, AJV, Vitest)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [fatal, error, warn, info, debug, trace]
  DbHost:
    Type: String
    Default: users-db
    Description: Host de RDS (prod) o del contenedor Docker (local)
  DbPort:
    Type: Number
    Default: 5432
  DbName:
    Type: String
    Default: users_db
  DbSecretArn:
    Type: String
    Default: ''
    Description: ARN del secreto en Secrets Manager con DB_USER / DB_PASSWORD. Vacio en local.

Conditions:
  HasDbSecret: !Not [!Equals [!Ref DbSecretArn, '']]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: '--enable-source-maps'
        LOG_LEVEL: !Ref LogLevel
        STAGE: !Ref Stage

Resources:
  UsersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: dist/handlers/usersHandler.handler
      Description: CRUD de usuarios con arquitectura hexagonal
      AutoPublishAlias: !Ref Stage
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !If
                - HasDbSecret
                - !Ref DbSecretArn
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret/unused-local-only'
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_SECRET_ARN: !Ref DbSecretArn
          IS_LOCAL: 'false'
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users
            Method: POST
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users/{id}
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users/{id}
            Method: PUT
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users/{id}
            Method: DELETE
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /health
            Method: GET

  UsersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          MetricsEnabled: true
          DataTraceEnabled: false
      AccessLogSetting:
        DestinationArn: !GetAtt ApiLogsGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":$context.status,"latency":$context.responseLatency}'
      EndpointConfiguration:
        Type: REGIONAL

  ApiLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/users-crud-${Stage}'
      RetentionInDays: 14

  UsersFunctionLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/users-crud-${Stage}'
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL base de la API
    Value: !Sub 'https://${UsersApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UsersFunctionArn:
    Description: ARN de la funcion
    Value: !GetAtt UsersFunction.Arn